<meta charset="utf-8">
<title>FRL Overlay — start lights</title>
<style>
  /*
   * The start gantry, as its own OBS Browser Source.
   *
   * Five red lights come on one at a time, then all go out for green, exactly as the
   * operator steps them on the Race page. It draws nothing until the sequence starts and
   * fades itself out a moment after lights-out, so it can sit over the grid feed and only
   * appear when it matters.
   */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Inter, "Segoe UI", system-ui, sans-serif; }

  .gantry {
    display: flex; gap: 22px; padding: 26px 34px;
    background: rgba(8, 10, 14, .78);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    opacity: 0; transform: translateY(-14px) scale(.98);
    transition: opacity .4s cubic-bezier(.16,1,.3,1), transform .4s cubic-bezier(.16,1,.3,1);
  }
  .gantry.on { opacity: 1; transform: none; }

  .col { display: flex; flex-direction: column; gap: 14px; }
  .bulb {
    width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #2a0d0d, #140505 70%);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.05);
    transition: background .12s ease, box-shadow .12s ease;
  }
  .bulb.red {
    background: radial-gradient(circle at 38% 34%, #ff6a5a, #d60000 62%);
    box-shadow: 0 0 26px 4px rgba(255, 40, 20, .65), inset 0 0 0 3px rgba(255,255,255,.12);
  }
  .gantry.go .bulb {
    background: radial-gradient(circle at 38% 34%, #7bffb0, #00c853 62%);
    box-shadow: 0 0 30px 6px rgba(0, 220, 100, .7), inset 0 0 0 3px rgba(255,255,255,.14);
  }
</style>
<body>
<div class="gantry" id="gantry">
  <div class="col"><div class="bulb" data-i="0"></div><div class="bulb" data-i="0"></div></div>
  <div class="col"><div class="bulb" data-i="1"></div><div class="bulb" data-i="1"></div></div>
  <div class="col"><div class="bulb" data-i="2"></div><div class="bulb" data-i="2"></div></div>
  <div class="col"><div class="bulb" data-i="3"></div><div class="bulb" data-i="3"></div></div>
  <div class="col"><div class="bulb" data-i="4"></div><div class="bulb" data-i="4"></div></div>
</div>

<script src="/supabase-config.js"></script>
<script type="module">
import { Bus } from '../js/shared.js';
import { CloudBus, cloudOptions } from '../js/cloudbus.js';

const cloud = cloudOptions();
const bus = cloud ? new CloudBus('overlay', cloud) : new Bus('overlay');

const gantry = document.getElementById('gantry');
const bulbs = [...document.querySelectorAll('.bulb')];
let hideTimer = null;

// 0 off, 1..5 that many red columns lit (left to right), 6 lights out = green.
function paint(n) {
  clearTimeout(hideTimer);
  const go = n >= 6;
  gantry.classList.toggle('go', go);
  for (const b of bulbs) {
    const i = Number(b.dataset.i);
    b.classList.toggle('red', !go && n > i);
  }
  if (n <= 0) { gantry.classList.remove('on'); return; }
  gantry.classList.add('on');
  // Clear the gantry a few seconds after lights-out so it does not sit on the racing shot.
  if (go) hideTimer = setTimeout(() => gantry.classList.remove('on'), 3000);
}

bus.on('state', (state) => paint((state.race && state.race.lights) || 0));
</script>
</body>
</html>
