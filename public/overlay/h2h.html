<meta charset="utf-8">
<title>FRLcast overlay: h2h</title><body data-widgets="h2h">
<div class="stage"></div>
<script src="/supabase-config.js"></script>
<script>
(function () {
  function load(v) {
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = 'overlay.css?v=' + v;
    document.head.appendChild(l);
    var s = document.createElement('script');
    s.type = 'module'; s.src = 'overlay.js?v=' + v;
    document.body.appendChild(s);
  }
  try {
    fetch('/api/version').then(function (r) { return r.json(); })
      .then(function (j) { load(j.current || j.version || Date.now()); })
      .catch(function () { load(Date.now()); });
  } catch (e) { load(Date.now()); }
})();
</script>
