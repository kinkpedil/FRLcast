<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Judge · FRLcast</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d11">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  /*
   * A judge's phone. Held in one hand at the side of the track, looked at for a second at a
   * time: one decision per screen, buttons a thumb cannot miss, and the current call always
   * visible so a judge knows the press landed.
   */
  :root { --bg: #0b0d11; --card: #141922; --line: #283039; --ink: #eef1f5; --mute: #8c939f;
          --a: #00e0a4; --b: #ff9f0a; --bad: #ff5a4e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 500 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh;
         padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
  header b { font-size: 18px; }
  header span { color: var(--mute); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header i { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
  header i.on { background: var(--a); }
  main { padding-top: 16px; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--mute); text-transform: uppercase; }
  h1 { font-size: 26px; margin: 4px 0 2px; text-transform: uppercase; }
  .sub { color: var(--mute); font-size: 14px; }
  .wait { text-align: center; color: var(--mute); padding: 40px 10px; }
  .wait b { display: block; color: var(--ink); font-size: 20px; margin-bottom: 6px; }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 16px 0; }
  .side { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; border-top: 4px solid var(--c, #666); }
  .side b { display: block; font-size: 18px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side small { color: var(--mute); font-size: 12px; font-weight: 700; letter-spacing: .1em; }
  .vs { color: var(--mute); font-weight: 700; }
  .calls { display: grid; gap: 10px; margin-top: 8px; }
  .call { height: 72px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--ink);
          font: 800 20px system-ui, sans-serif; text-transform: uppercase; cursor: pointer; }
  .call.a.on { background: var(--a); border-color: var(--a); color: #04120d; }
  .call.b.on { background: var(--b); border-color: var(--b); color: #150c00; }
  .call.omt.on { background: #fff; border-color: #fff; color: #000; }
  .mine { text-align: center; margin-top: 12px; color: var(--mute); font-size: 14px; }
  .mine b { color: var(--ink); }
  .cat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .cat .top { display: flex; align-items: baseline; gap: 6px; }
  .cat .top b { margin-left: auto; }
  .cat .top span { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--mute); text-transform: uppercase; }
  .cat .top b { font: 800 28px ui-monospace, Menlo, Consolas, monospace; }
  .cat .top small { color: var(--mute); font-size: 13px; }
  .cat input[type=range] { width: 100%; margin: 10px 0 4px; accent-color: var(--a); height: 32px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .steps button { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #1b212b; color: var(--ink); font: 700 15px system-ui, sans-serif; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 10px; }
  .total span { color: var(--mute); font-weight: 700; letter-spacing: .1em; font-size: 13px; }
  .total b { font: 800 40px ui-monospace, Menlo, Consolas, monospace; color: var(--a); }
  .send { width: 100%; height: 60px; border-radius: 14px; border: 0; background: var(--a); color: #04120d; font: 800 19px system-ui, sans-serif; }
  .send:disabled { opacity: .5; }
  .done { text-align: center; margin-top: 10px; color: var(--a); font-weight: 700; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); padding: 14px; border-radius: 12px;
           background: #2a1414; border: 1px solid var(--bad); color: #ffb4ad; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<header><b id="who">Judge</b><span id="ev"></span><i id="dot"></i></header>
<main id="main"><p class="wait">Connecting…</p></main>
<div id="toast"></div>

<script src="/supabase-config.js"></script>
<script type="module">
/*
 * The judge's page.
 *
 * It reads the event the same way an overlay does (the laptop's socket, or a hosted event
 * with ?event=CODE) and sends a judge's calls back with the key in the link: to the laptop
 * server over its LAN address, or to the hosted event through judge_submit. Race control
 * applies them exactly as if they had been clicked on its own screen.
 */
import { Bus } from './js/shared.js';
import { CloudBus, cloudOptions } from './js/cloudbus.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qs = new URLSearchParams(location.search);
const J = Math.max(1, Math.round(Number(qs.get('j')) || 1));
const K = (qs.get('k') || '').toUpperCase();
const cloud = cloudOptions();
const bus = cloud ? new CloudBus('judge', cloud) : new Bus('judge');

$('#who').textContent = `Judge ${J}`;
let state = null;
let draft = null;       // the scores being set for the run on track: { key, line, angle, style, total }
let lastHeard = 0;

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('on'), 3500);
}

async function send(kind, payload = {}) {
  try {
    if (cloud) {
      if (!bus.sb) throw new Error('Still connecting');
      const { data, error } = await bus.sb.rpc('judge_submit', {
        p_code: cloud.code, p_key: K, p_judge: J, p_kind: kind, p_payload: payload
      });
      if (error) throw error;
      if (data && data.ok === false) throw new Error(data.error || 'Refused');
    } else {
      const r = await fetch('/api/judge', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ k: K, j: J, kind, ...payload })
      });
      const o = await r.json().catch(() => ({}));
      if (!r.ok || o.ok === false) throw new Error(o.error || `Refused (${r.status})`);
    }
    lastHeard = Date.now();
    $('#dot').classList.add('on');
    return true;
  } catch (e) {
    $('#dot').classList.remove('on');
    if (kind !== 'ping') toast(e.message || String(e));
    return false;
  }
}

const driver = (id) => (state && state.drivers || []).find((d) => d.id === id) || null;

function render() {
  const main = $('#main');
  if (!K) {
    main.innerHTML = '<p class="wait"><b>This link has no key</b>Ask race control for your judge link.</p>';
    return;
  }
  if (!state) return;
  $('#ev').textContent = [state.event && state.event.name, state.event && state.event.round].filter(Boolean).join(' · ');
  const D = state.drift || {};
  const F = D.format || {};
  const judges = Math.max(1, F.judges || 1);
  if (J > judges) {
    main.innerHTML = `<p class="wait"><b>Race control is using ${judges} judge${judges === 1 ? '' : 's'}</b>This link is for judge ${J}.</p>`;
    return;
  }

  const b = D.battle;
  if (b && b.status === 'running') return renderBattle(main, D, b);
  const solo = D.solo;
  if (solo && solo.status === 'running') return renderSolo(main, D, solo);

  // Nothing to judge: what happened last, so the judge sees their calls counted.
  let last = '';
  if (b && b.status === 'decided') {
    const w = driver(b.winner);
    last = `<div class="sub" style="margin-top:8px">Last battle: <b>${esc(w ? w.name : '')}</b> won</div>`;
  } else if (solo && solo.status === 'scored') {
    const d = driver(solo.driverId);
    last = `<div class="sub" style="margin-top:8px">Last run: ${esc(d ? d.name : '')} scored <b>${solo.total}</b></div>`;
  }
  main.innerHTML = `<div class="wait"><b>Waiting for race control</b>The next run or battle appears here on its own.${last}</div>`;
}

function renderBattle(main, D, b) {
  const A = driver(b.a), B = driver(b.b);
  const mine = (b.votes || [])[J - 1];
  const round = b.round === 'third' ? 'Third place' : ((D.bracket || [])[b.round] || {}).name || 'Battle';
  const lead = b.lead === 'a' ? A : B;
  const side = (d, who) => `<div class="side" style="--c:${esc(d ? d.color : '#666')}">
      <b>${esc(d ? d.name : '?')}</b><small>${b.lead === who ? 'LEAD' : 'CHASE'}</small></div>`;
  const sig = JSON.stringify(['battle', b.a, b.b, b.run, b.omt, mine]);
  if (main.dataset.sig === sig) return;
  main.dataset.sig = sig;
  main.innerHTML = `
    <div class="kicker">${esc(round)} · Run ${b.run}${b.omt ? ` · One more time ${b.omt}` : ''}</div>
    <h1>${esc(lead ? lead.name : '')} leads</h1>
    <div class="pair">${side(A, 'a')}<span class="vs">VS</span>${side(B, 'b')}</div>
    <div class="calls">
      <button class="call a ${mine === 'a' ? 'on' : ''}" data-v="a">${esc(A ? A.name : 'A')}</button>
      <button class="call omt ${mine === 'omt' ? 'on' : ''}" data-v="omt">One more time</button>
      <button class="call b ${mine === 'b' ? 'on' : ''}" data-v="b">${esc(B ? B.name : 'B')}</button>
    </div>
    <div class="mine">${mine ? `Your call: <b>${esc(mine === 'a' ? A && A.name : mine === 'b' ? B && B.name : 'One more time')}</b>. Tap another to change it.` : 'Call it after both runs.'}</div>`;
  main.querySelectorAll('[data-v]').forEach((btn) => {
    btn.onclick = () => {
      if (navigator.vibrate) navigator.vibrate(30);
      main.querySelectorAll('[data-v]').forEach((x) => x.classList.toggle('on', x === btn));
      send('vote', { vote: btn.dataset.v });
    };
  });
}

function renderSolo(main, D, solo) {
  const F = D.format || {};
  const single = F.scoring === 'single';
  const cats = F.categories || { line: 35, angle: 30, style: 35 };
  const d = driver(solo.driverId);
  const key = `${solo.driverId}|${solo.run}|${solo.at}`;
  const given = (solo.scores || [])[J - 1];
  if (!draft || draft.key !== key) {
    draft = given
      ? { key, ...given }
      : { key, line: Math.round(cats.line * 0.7), angle: Math.round(cats.angle * 0.7), style: Math.round(cats.style * 0.7), total: 70 };
  }
  const sig = JSON.stringify(['solo', key, !!given, single]);
  if (main.dataset.sig === sig) return updateTotal();
  main.dataset.sig = sig;
  const row = (k, label, max) => `<div class="cat">
      <div class="top"><span>${label}</span><b data-out="${k}">${draft[k]}</b><small>/ ${max}</small></div>
      <input type="range" min="0" max="${max}" step="0.5" value="${draft[k]}" data-k="${k}">
      <div class="steps"><button data-step="${k}" data-d="-1">−1</button><button data-step="${k}" data-d="-0.5">−0.5</button>
        <button data-step="${k}" data-d="0.5">+0.5</button><button data-step="${k}" data-d="1">+1</button></div>
    </div>`;
  main.innerHTML = `
    <div class="kicker">Qualifying · Run ${solo.run + 1}</div>
    <h1 style="color:${esc(d ? d.color : 'inherit')}">${esc(d ? d.name : '?')}</h1>
    <div class="sub">#${esc(d ? d.num : '')}</div>
    ${single ? row('total', 'Score', 100)
      : row('line', 'Line', cats.line) + row('angle', 'Angle', cats.angle) + row('style', 'Style', cats.style)}
    <div class="total"><span>TOTAL</span><b id="tot"></b></div>
    <button class="send" id="send">${given ? 'Update score' : 'Send score'}</button>
    ${given ? '<div class="done">Your score is in. Change it and send again if you need to.</div>' : ''}`;
  const max = { line: cats.line, angle: cats.angle, style: cats.style, total: 100 };
  const set = (k, v) => {
    draft[k] = Math.max(0, Math.min(max[k], Math.round(v * 2) / 2));
    const out = main.querySelector(`[data-out="${k}"]`);
    if (out) out.textContent = draft[k];
    const range = main.querySelector(`[data-k="${k}"]`);
    if (range) range.value = draft[k];
    updateTotal();
  };
  main.querySelectorAll('[data-k]').forEach((r) => { r.oninput = () => set(r.dataset.k, Number(r.value)); });
  main.querySelectorAll('[data-step]').forEach((b) => {
    b.onclick = () => set(b.dataset.step, draft[b.dataset.step] + Number(b.dataset.d));
  });
  $('#send').onclick = async () => {
    $('#send').disabled = true;
    const payload = single ? { total: draft.total } : { line: draft.line, angle: draft.angle, style: draft.style };
    const ok = await send('score', payload);
    $('#send').disabled = false;
    if (ok && navigator.vibrate) navigator.vibrate([30, 40, 30]);
  };
  updateTotal();

  function updateTotal() {
    const t = single ? draft.total : draft.line + draft.angle + draft.style;
    const el = $('#tot');
    if (el) el.textContent = Math.round(t * 10) / 10;
  }
}

bus.on('state', (s) => {
  state = s;
  render();
  if (!lastHeard) send('ping');
});
// Race control shows which judges are connected; this keeps the light on.
setInterval(() => send('ping'), 15000);
render();
</script>
</body>
</html>
