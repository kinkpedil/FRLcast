<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<title>FRLcast: predict the winner</title>
<meta name="description" content="Pick who wins this FR Legends race and see how the crowd calls it, live.">
<meta name="theme-color" content="#0b0d11">
<style>
  :root{
    --bg:#0b0d11; --card:#12151c; --ink:#eef2f7; --mute:#8b93a2; --line:#232833;
    --accent:#00e0a4; --hit:#30d158;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .flagpill{font-size:12px;font-weight:800;letter-spacing:.12em;padding:5px 12px;border-radius:999px;background:#2a2f3a}
  .flagpill.green{background:#123d22;color:#5be08a}.flagpill.white{background:#e9ecf2;color:#111}
  .flagpill.finished{background:#e9ecf2;color:#111}.flagpill.red{background:#3d1414;color:#ff7a6a}
  h1{font-size:22px;margin:8px 0 2px}
  .sub{color:var(--mute);font-size:14px;margin-bottom:18px}
  .lead{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px}
  .pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;
        border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;position:relative;overflow:hidden}
  .pick .fill{position:absolute;inset:0;background:rgba(0,224,164,.14);width:0;transition:width .5s cubic-bezier(.16,1,.3,1)}
  .pick.mine{border-color:var(--accent)}
  .pick.win{border-color:var(--hit)}.pick.win .fill{background:rgba(48,209,88,.2)}
  .pick>*{position:relative}
  .cbar{width:10px;height:30px;border-radius:3px;flex:0 0 auto}
  .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--mute);min-width:30px}
  .nm{font-weight:700;flex:1}
  .pct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mute)}
  .tag{font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:#123d22;color:#5be08a}
  .note{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14px;color:var(--mute)}
  .note b{color:var(--ink)}
  .langs{margin-left:auto;display:flex;gap:6px}
  .langs button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer}
  .langs button.on{color:var(--ink);border-color:var(--accent)}
  #loading{color:var(--mute);padding:40px 0;text-align:center}
  footer{margin-top:30px;color:var(--mute);font-size:12px;text-align:center}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="flagpill" id="flag">--</span>
    <div class="langs"><button data-lang="en">EN</button><button data-lang="id">ID</button></div>
  </header>
  <h1 id="evname">Event</h1>
  <div class="sub" id="where"></div>
  <div id="loading">Loading…</div>
  <div id="app" hidden>
    <p class="lead" id="prompt" data-t="prompt">Who wins? Tap your pick.</p>
    <div id="picks"></div>
    <div class="note" id="note" hidden></div>
  </div>
  <footer>FRLcast by kinkpedil12 · <a id="hublink" href="/">event hub</a></footer>
</div>

<script src="/supabase-config.js?v=20261002175751"></script>
<script type="module">
  import { FLAG_LABEL } from './js/shared.js';
  import { CloudBus, cloudOptions } from './js/cloudbus.js';

  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const code = params.get('event') || '';

  const STR = {
    en: { prompt: 'Who wins? Tap your pick.', locked: 'Predictions are locked, the race has started.',
          youpicked: 'You picked', called: 'of the crowd called the winner.', winner: 'Winner',
          none: 'No cars on the grid yet.', need: 'Add ?event=CODE to the address.', nofound: 'No event found for ',
          votes: 'picks' },
    id: { prompt: 'Siapa yang menang? Ketuk pilihanmu.', locked: 'Prediksi dikunci, balapan sudah mulai.',
          youpicked: 'Kamu memilih', called: 'penonton menebak pemenang dengan benar.', winner: 'Pemenang',
          none: 'Belum ada mobil di grid.', need: 'Tambahkan ?event=CODE di alamat.', nofound: 'Event tidak ditemukan: ',
          votes: 'tebakan' }
  };
  let lang = (localStorage.getItem('frl.lang') === 'id') ? 'id' : 'en';
  let last = null, counts = {}, total = 0, mine = null, bus = null;

  const voter = (() => {
    try { let v = localStorage.getItem('frl.voter'); if (!v) { v = Math.random().toString(36).slice(2); localStorage.setItem('frl.voter', v); } return v; }
    catch (e) { return 'anon' + Math.random().toString(36).slice(2); }
  })();

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // Predictions lock once the race is under way, so this stays a pre-race guess.
  function locked(s) { return s && !['idle', 'formation'].includes(s.race.status || 'idle'); }
  function finished(s) { return s && s.race.status === 'finished'; }

  document.querySelectorAll('[data-lang]').forEach((b) => {
    b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('frl.lang', lang); } catch (e) {} applyLang(); };
  });
  function applyLang() {
    document.querySelectorAll('[data-lang]').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = STR[lang][el.dataset.t] || el.textContent; });
    $('#hublink').href = '/?event=' + encodeURIComponent(code);
    if (last) render(last);
  }

  async function pick(num, s) {
    if (locked(s)) return;
    mine = num;
    render(s);
    try { await bus.sb.from('predictions').upsert({ event_id: bus.event.id, voter, choice: num }, { onConflict: 'event_id,voter' }); }
    catch (e) {}
    tally();
  }

  async function tally() {
    if (!bus || !bus.event) return;
    try {
      const { data } = await bus.sb.from('predictions').select('voter,choice').eq('event_id', bus.event.id);
      counts = {}; total = 0;
      for (const r of data || []) { counts[r.choice] = (counts[r.choice] || 0) + 1; total++; if (r.voter === voter) mine = r.choice; }
    } catch (e) {}
    if (last) render(last);
  }

  function render(s) {
    last = s;
    const T = STR[lang];
    $('#loading').hidden = true;
    $('#app').hidden = false;
    $('#evname').textContent = s.event.name || 'Event';
    $('#where').textContent = [s.event.round, s.event.track].filter(Boolean).join(' · ');
    const flag = s.race.status || 'idle';
    $('#flag').className = 'flagpill ' + flag;
    $('#flag').textContent = FLAG_LABEL[flag] || flag.toUpperCase();
    $('#prompt').textContent = locked(s) ? T.locked : T.prompt;

    const winner = finished(s) ? (s.drivers || []).find((d) => d.position === 1 && !d.dnf) : null;
    const grid = (s.drivers || []).slice().sort((a, b) => (parseInt(a.num, 10) || 999) - (parseInt(b.num, 10) || 999));
    if (!grid.length) { $('#picks').innerHTML = `<div class="note">${T.none}</div>`; return; }

    $('#picks').innerHTML = grid.map((d) => {
      const c = counts[d.num] || 0;
      const pct = total ? Math.round(c * 100 / total) : 0;
      const cls = ['pick', mine === d.num ? 'mine' : '', winner && winner.num === d.num ? 'win' : ''].filter(Boolean).join(' ');
      const show = total > 0 || locked(s);
      return `<button class="${cls}" data-num="${esc(d.num)}">
        <span class="fill" style="width:${show ? pct : 0}%"></span>
        <span class="cbar" style="background:${d.color || '#666'}"></span>
        <span class="num">${esc(d.num)}</span>
        <span class="nm">${esc(d.name)}</span>
        ${winner && winner.num === d.num ? `<span class="tag">${T.winner}</span>` : ''}
        <span class="pct">${show ? pct + '%' : ''}</span>
      </button>`;
    }).join('');
    $('#picks').querySelectorAll('button[data-num]').forEach((b) => { b.onclick = () => pick(b.dataset.num, s); });

    const note = $('#note');
    if (winner) {
      const right = counts[winner.num] || 0;
      const rate = total ? Math.round(right * 100 / total) : 0;
      note.hidden = false;
      note.innerHTML = `<b>${T.winner}: ${esc(winner.name)}</b> · ${rate}% ${T.called}` +
        (mine ? `<br>${T.youpicked} <b>${esc((grid.find((d) => d.num === mine) || {}).name || mine)}</b>.` : '');
    } else if (total > 0) {
      note.hidden = false; note.textContent = `${total} ${T.votes}`;
    } else { note.hidden = true; }
  }

  const cloud = cloudOptions();
  if (!code) { $('#loading').textContent = STR[lang].need; }
  else if (!cloud) { $('#loading').textContent = 'This page needs Supabase configured.'; }
  else {
    bus = new CloudBus('predict', cloud);
    bus.on('state', render);
    bus.on('open', () => { tally(); setInterval(tally, 5000); });
    setTimeout(() => { if (!last) $('#loading').textContent = STR[lang].nofound + code; }, 6000);
  }
  applyLang();
</script>
</body>
</html>
